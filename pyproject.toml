[project]
name = "cuentos-a-mi-medida"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "boto3>=1.43.116",
    "diffusers>=0.41.0",
    "fastapi>=0.158.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "piper-tts>=1.8.0",
    "torch>=2.6",
    "transformers>=5.20.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
repro = [
    "clean-fid>=0.1.35",
    "lpips>=0.1.4",
    "open-clip-torch>=3.3.0",
]

[tool.ruff]
line-length = 120
